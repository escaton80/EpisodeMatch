name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      # Review 8.1: 3.11 and 3.12 must fail INDEPENDENTLY — one broken
      # version must not hide the other's results.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      # Full pytest output on CI (the Qt-suite hard exit would otherwise
      # swallow the failure details the moment anything breaks).
      EM_NO_HARD_EXIT: "1"
      EM_QT_TESTS: "1"
      PYTEST_ADDOPTS: --tb=short
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EpisodeMatch with dev + GUI extras
        run: pip install -e .[dev,gui]
      - name: Run the test suite (offline)
        run: python -m pytest -q
